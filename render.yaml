services:
  - type: web
    name: recapkit-video-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: RECAPKIT_API_KEY
        sync: false
      - key: RECAPKIT_REQUIRE_API_KEY
        value: "true"
      - key: RECAPKIT_STORAGE_DIR
        value: /tmp/recapkit-storage
      - key: CORS_ORIGINS
        value: https://video-recap-app.vercel.app
